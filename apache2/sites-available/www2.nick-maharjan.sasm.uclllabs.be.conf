<VirtualHost *:80>
    ServerName www2.nick-maharjan.sasm.uclllabs.be
    DocumentRoot /var/www/www2.nick-maharjan.sasm.uclllabs.be

    <Directory /var/www/www2.nick-maharjan.sasm.uclllabs.be>
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/www2.nick-maharjan.sasm.uclllabs.be_error.log
    CustomLog ${APACHE_LOG_DIR}/www2.nick-maharjan.sasm.uclllabs.be_access.log combined
</VirtualHost>
    <Directory /var/www/www2.nick-maharjan.sasm.uclllabs.be>
        Options -Indexes
    </Directory>
