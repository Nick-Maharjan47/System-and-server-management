<VirtualHost *:80>
    ServerName www1.nick-maharjan.sasm.uclllabs.be
    DocumentRoot /var/www/www1.nick-maharjan.sasm.uclllabs.be

    <Directory /var/www/www1.nick-maharjan.sasm.uclllabs.be>
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/www1.nick-maharjan.sasm.uclllabs.be_error.log
    CustomLog ${APACHE_LOG_DIR}/www1.nick-maharjan.sasm.uclllabs.be_access.log combined
</VirtualHost>
    <Directory "/var/www/www1.nick-maharjan.sasm.uclllabs.be/private">
        AuthType Basic
        AuthName "Restricted Area"
        AuthUserFile /etc/apache2/.htpasswd
        Require valid-user
    </Directory>
